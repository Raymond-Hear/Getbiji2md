<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png">

  <link rel="apple-touch-icon" href="icons/icon512.png">
  <title>页面未找到｜Get2MD</title>
  <style>
    :root {
      --paper: #f6f7f2;
      --ink: #17201d;
      --muted: #63716b;
      --line: rgba(23, 32, 29, 0.12);
      --brand: #26685f;
      --brand-dark: #174c45;
      --accent: #c46f3d;
      --surface: rgba(255, 254, 250, 0.84);
      --shadow: 0 22px 54px rgba(23, 32, 29, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(38, 104, 95, 0.13), transparent 34%),
        linear-gradient(225deg, rgba(196, 111, 61, 0.11), transparent 30%),
        linear-gradient(180deg, #fbfbf6 0%, var(--paper) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(23, 32, 29, 0.045) 1px, transparent 1px);
      background-size: 100% 34px;
      opacity: 0.55;
    }

    .page {
      position: relative;
      width: min(920px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 56px;
      display: grid;
      align-content: center;
    }

    .card {
      padding: clamp(28px, 7vw, 64px);
      border-radius: 30px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      font-weight: 850;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      box-shadow: 0 10px 26px rgba(23, 32, 29, 0.12);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(196, 111, 61, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      max-width: 760px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 8vw, 80px);
      line-height: 0.98;
      font-weight: 700;
    }

    p {
      max-width: 650px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--line);
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      background: rgba(255, 254, 250, 0.74);
    }

    .btn-primary {
      background: var(--brand);
      color: #f7fffc;
      box-shadow: 0 16px 32px rgba(38, 104, 95, 0.18);
    }

    @media (max-width: 640px) {
      .page {
        align-content: start;
        padding-top: 18px;
      }

      .actions,
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="页面未找到">
      <div class="brand">
        <img src="icons/icon128.png" alt="">
        <span>Get2MD</span>
      </div>
      <span class="eyebrow">404</span>
      <h1>这个页面没有找到</h1>
      <p>可能是链接输错了，或者页面已经移动。你可以回到介绍页，直接打开导出工具，或者先看常见问题。</p>
      <div class="actions">
        <a class="btn btn-primary" href="app.html">打开导出工具</a>
        <a class="btn" href="index.html">返回介绍</a>
        <a class="btn" href="help.html">常见问题</a>
      </div>
    </section>
  </main>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
